<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NASM-CPT 刷题</title>
<style>
  :root {
    --bg: #F5F5F3;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --sub: #666666;
    --light: #AAAAAA;
    --border: #E5E5E2;
    --green: #2D9E6B;
    --green-bg: #EAF7F1;
    --red: #D94F3D;
    --red-bg: #FDECEA;
    --blue: #3A72C8;
    --blue-bg: #EBF1FC;
    --yellow: #D4820A;
    --yellow-bg: #FEF3DC;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 80px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 20px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar-back { font-size: 22px; cursor: pointer; color: var(--blue); display: none; padding: 2px 6px 2px 0; }
  .topbar-title { font-size: 17px; font-weight: 600; flex: 1; }
  .topbar-badge { font-size: 12px; color: var(--sub); background: var(--bg); border-radius: 20px; padding: 3px 10px; }
  #home { padding: 24px 20px; }
  .hello { margin-bottom: 24px; }
  .hello-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .hello-sub { font-size: 14px; color: var(--sub); }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 28px; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 12px; text-align: center; box-shadow: var(--shadow); }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--blue); }
  .stat-lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 12px; letter-spacing: 0.03em; }
  .chapter-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .chapter-card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; display: flex; align-items: center;
    gap: 14px; box-shadow: var(--shadow); cursor: pointer;
    transition: transform 0.12s; border: 1.5px solid transparent;
  }
  .chapter-card:active { transform: scale(0.98); }
  .chapter-card.has-wrong { border-color: var(--red); }
  .ch-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .ch-info { flex: 1; }
  .ch-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .ch-meta { font-size: 12px; color: var(--sub); }
  .ch-progress { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .ch-progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .ch-arrow { color: var(--light); font-size: 16px; }
  .action-btn { width: 100%; padding: 16px; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .action-btn:active { opacity: 0.8; }
  .btn-primary { background: var(--blue); color: white; }
  .btn-wrong { background: var(--red-bg); color: var(--red); }
  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  #quiz { display: none; padding: 16px 20px; }
  .progress-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--border); z-index: 200; }
  .progress-fill { height: 100%; background: var(--blue); transition: width 0.3s; border-radius: 0 2px 2px 0; }
  .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .q-counter { font-size: 13px; color: var(--sub); }
  .q-bookmark { font-size: 22px; cursor: pointer; padding: 4px; transition: transform 0.15s; }
  .q-bookmark:active { transform: scale(1.3); }
  .q-chapter-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--blue-bg); color: var(--blue); margin-bottom: 12px; }
  .q-text { font-size: 17px; font-weight: 600; line-height: 1.55; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
    font-size: 15px; line-height: 1.4;
  }
  .option:active { background: var(--bg); }
  .opt-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; font-weight: 600; transition: all 0.15s; }
  .option.correct { border-color: var(--green); background: var(--green-bg); }
  .option.correct .opt-dot { background: var(--green); border-color: var(--green); color: white; }
  .option.wrong { border-color: var(--red); background: var(--red-bg); }
  .option.wrong .opt-dot { background: var(--red); border-color: var(--red); color: white; }
  .option.dim { opacity: 0.45; }
  .explanation { margin-top: 16px; padding: 14px 16px; background: var(--yellow-bg); border-radius: var(--radius); border-left: 3px solid var(--yellow); font-size: 14px; line-height: 1.6; color: #4A3800; display: none; }
  .explanation.show { display: block; }
  .exp-label { font-weight: 700; margin-bottom: 4px; color: var(--yellow); font-size: 12px; }
  .q-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px 28px; background: var(--bg); border-top: 1px solid var(--border); }
  .next-btn { width: 100%; padding: 15px; background: var(--blue); color: white; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; display: none; transition: opacity 0.15s; }
  .next-btn:active { opacity: 0.8; }
  #result { display: none; padding: 24px 20px; text-align: center; }
  .result-emoji { font-size: 64px; margin-bottom: 16px; }
  .result-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { font-size: 15px; color: var(--sub); margin-bottom: 32px; }
  .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
  .result-stat { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .rs-num { font-size: 28px; font-weight: 700; }
  .rs-lbl { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .result-btns { display: flex; flex-direction: column; gap: 10px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.25s ease; }
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-back" id="backBtn" onclick="goHome()">‹</span>
  <span class="topbar-title" id="topTitle">NASM-CPT 刷题</span>
  <span class="topbar-badge" id="topBadge"></span>
</div>
<div class="progress-bar" id="progressBar" style="display:none">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- 首页 -->
<div id="home">
  <div class="hello">
    <div class="hello-title">备考加油 🍅</div>
    <div class="hello-sub">选择章节开始练习，或随机刷全部题目</div>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">已答题数</div></div>
    <div class="stat-card"><div class="stat-num" id="statAcc" style="color:var(--green)">—</div><div class="stat-lbl">正确率</div></div>
    <div class="stat-card"><div class="stat-num" id="statWrong" style="color:var(--red)">0</div><div class="stat-lbl">错题数</div></div>
  </div>
  <div class="section-title">按章节练习</div>
  <div class="chapter-list" id="chapterList"></div>
  <div class="btn-row">
    <button class="action-btn btn-primary" onclick="startQuiz('all')">🎲 随机刷全部题目</button>
    <button class="action-btn btn-wrong" id="wrongBtn" onclick="startQuiz('wrong')" style="display:none">⚠️ 专项练习错题</button>
  </div>
</div>

<!-- 答题页 -->
<div id="quiz">
  <div class="q-header">
    <span class="q-counter" id="qCounter"></span>
    <span class="q-bookmark" id="bookmark" onclick="toggleBookmark()">☆</span>
  </div>
  <div class="q-chapter-tag" id="qChapterTag"></div>
  <div class="q-text" id="qText"></div>
  <div class="options" id="options"></div>
  <div class="explanation" id="explanation">
    <div class="exp-label">💡 解析</div>
    <div id="expText"></div>
  </div>
  <div style="height:80px"></div>
  <div class="q-footer">
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">继续</button>
  </div>
</div>

<!-- 结果页 -->
<div id="result">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="result-title" id="resultTitle"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-stats">
    <div class="result-stat"><div class="rs-num" id="rs1"></div><div class="rs-lbl">答对题数</div></div>
    <div class="result-stat"><div class="rs-num" id="rs2" style="color:var(--red)"></div><div class="rs-lbl">答错题数</div></div>
    <div class="result-stat"><div class="rs-num" id="rs3" style="color:var(--blue)"></div><div class="rs-lbl">正确率</div></div>
    <div class="result-stat"><div class="rs-num" id="rs4" style="color:var(--yellow)"></div><div class="rs-lbl">收藏题数</div></div>
  </div>
  <div class="result-btns">
    <button class="action-btn btn-primary" onclick="goHome()">返回首页</button>
    <button class="action-btn btn-wrong" id="retryWrongBtn" onclick="startQuiz('wrong')" style="display:none">再练错题</button>
  </div>
</div>

<script>
const QUESTIONS = [
  // ══ Ch1-2 执业范围与行为改变 ══
  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"以下哪项超出了NASM认证私人教练（CPT）的执业范围？",
   opts:["设计渐进式阻力训练计划","为客户提供具体的治疗饮食方案","进行体能评估和动作筛查","教授正确的运动技术"],
   ans:1, exp:"CPT执业范围不包括为特定医疗状况提供治疗性饮食建议，这属于注册营养师（RD）职责。CPT可提供一般营养教育，但不能针对疾病开具饮食处方。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"处于行为改变「沉思阶段」（Contemplation）的客户特征是？",
   opts:["完全没有考虑运动","正在积极运动但不足6个月","意识到需要改变并计划6个月内行动","已规律运动超过6个月"],
   ans:2, exp:"沉思阶段：客户认识到需要改变，计划在未来6个月内行动，但尚未开始。前沉思=未考虑；准备=计划1个月内；行动=改变不足6个月；维持=超过6个月。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"PAR-Q（体力活动准备问卷）的主要用途是？",
   opts:["评估客户体能水平","筛查是否需要运动前咨询医生","制定营养计划","评估心理健康状况"],
   ans:1, exp:"PAR-Q是运动前健康筛查工具，用于识别需要先咨询医生再开始运动计划的人群，是CPT必须使用的首要风险筛查工具。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"「自我效能感」（Self-efficacy）指的是？",
   opts:["客户对运动的整体兴趣","客户相信自己能成功完成特定任务的信心","客户的实际体能水平","社会环境对客户的影响"],
   ans:1, exp:"自我效能感（班杜拉理论）是个人对自己能完成特定任务的信念和信心。高自我效能感的客户更可能坚持训练计划，是行为改变的重要预测因素。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"知情同意书（Informed Consent）的主要目的是？",
   opts:["完全免除教练所有法律责任","确认客户了解潜在风险并自愿参与","证明客户体能符合训练要求","替代医疗健康问卷"],
   ans:1, exp:"知情同意书确保客户在充分了解训练潜在风险的前提下自愿参与。它不能完全免除教练过失责任，也不替代PAR-Q或医疗问卷。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"以下哪种沟通方式最符合NASM建议？",
   opts:["以专业权威姿态告知客户应做什么","主要用封闭式问题快速收集信息","运用动机性访谈，以开放式问题引导","避免讨论客户个人生活和情绪"],
   ans:2, exp:"NASM推荐动机性访谈（Motivational Interviewing），核心是开放式问题、积极倾听、反思性回应，帮助客户发现内在动机。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"「循证实践」（Evidence-based practice）的三个核心要素是？",
   opts:["客户目标、训练器械、教练经验","科学研究、临床经验、客户价值观","解剖学、生理学、生物力学","评估、计划、实施"],
   ans:1, exp:"循证实践三要素：①最佳可用科学研究证据；②教练的临床专业经验；③客户的个人价值观与偏好。三者结合才能制定最优训练方案。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"客户处于「准备阶段」（Preparation）时，最适合的教练策略是？",
   opts:["提供运动重要性信息激发意识","帮助客户制定具体可行的行动计划","重点关注维持长期习惯的策略","评估客户是否真的准备好"],
   ans:1, exp:"准备阶段（计划1个月内开始）：客户已有改变意愿，教练应协助制定具体SMART目标，提供结构化支持，帮助从意图转化为行动。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"「SMART目标」设定中，「M」代表什么？",
   opts:["有意义的（Meaningful）","可测量的（Measurable）","可激励的（Motivational）","多维度的（Multi-dimensional）"],
   ans:1, exp:"SMART目标：S=Specific（具体）、M=Measurable（可测量）、A=Attainable（可实现）、R=Relevant（相关）、T=Time-bound（有时限）。可测量性确保客户能追踪进度。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"「外在动机」（Extrinsic Motivation）的例子是？",
   opts:["因为喜欢运动带来的愉悦感而锻炼","为了赢得比赛奖金而训练","因为运动让自己感觉更好而坚持","为了个人成长和自我挑战而运动"],
   ans:1, exp:"外在动机来自外部奖励或压力（奖金、他人认可、避免惩罚）。内在动机来自内部（乐趣、满足感、个人成长）。研究表明内在动机对长期行为维持更有效。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"当客户在「维持阶段」（Maintenance）面临复发风险时，教练应？",
   opts:["重新从前沉思阶段开始整个流程","提供复发预防策略，强化应对技巧","减少与客户的沟通频率","更换全新的训练计划刺激兴趣"],
   ans:1, exp:"维持阶段（规律运动超6个月）的主要挑战是防止复发。教练应帮助客户识别高风险情境，制定应对策略（如遇节假日或出差的备选计划），强化长期习惯。"},

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",
   q:"「社会支持」（Social Support）在行为改变中的作用是？",
   opts:["与个人运动动机无关","是行为改变最重要的单一因素","增加客户坚持运动的可能性","只对初学者有效，对有经验者无效"],
   ans:2, exp:"社会支持（来自家人、朋友、教练、训练伙伴）显著提高运动依从性。研究表明有训练伙伴或教练支持的人更可能长期坚持运动计划。"},

  // ══ Ch3-5 解剖生理 ══
  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"「旋转肌袖」（Rotator Cuff）由哪四块肌肉组成？",
   opts:["三角肌、胸大肌、背阔肌、冈上肌","冈上肌、冈下肌、小圆肌、肩胛下肌","前锯肌、菱形肌、斜方肌、肩胛下肌","肱二头肌、肱三头肌、冈上肌、冈下肌"],
   ans:1, exp:"旋转肌袖记忆口诀 SITS：冈上肌（Supraspinatus）、冈下肌（Infraspinatus）、小圆肌（Teres Minor）、肩胛下肌（Subscapularis）。这四块肌肉稳定肩关节。"},

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"心输出量（Cardiac Output）的计算公式是？",
   opts:["心率 × 体重","心率 × 每搏输出量","收缩压 - 舒张压","最大摄氧量 ÷ 体重"],
   ans:1, exp:"心输出量（CO）= 心率（HR）× 每搏输出量（SV）。正常静息心输出量约5L/min，运动时可增至20-25L/min。是评估心肺功能的核心公式。"},

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"「慢肌纤维」（Type I）的主要特征是？",
   opts:["爆发力强、容易疲劳、无氧代谢为主","耐力好、不易疲劳、有氧代谢为主","体积大、力量强、适合重量训练","收缩速度快、适合冲刺跳跃"],
   ans:1, exp:"Type I（慢肌纤维）：线粒体密度高、毛细血管丰富、有氧氧化供能、耐疲劳性强，适合长时间低强度活动。Type II（快肌纤维）爆发力强但容易疲劳。"},

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"膝关节在矢状面（Sagittal Plane）的主要运动是？",
   opts:["内翻和外翻","屈曲和伸展","内旋和外旋","内收和外展"],
   ans:1, exp:"矢状面（前后分割身体）上的运动是屈曲和伸展。额状面：内收/外展、内翻/外翻。水平面：旋转（内旋/外旋）。"},

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"「肌梭」（Muscle Spindle）的功能是？",
   opts:["感知肌腱张力，防止过度收缩","感知肌肉长度变化，引发牵张反射","储存肌肉收缩所需ATP","调节肌肉收缩节律"],
   ans:1, exp:"肌梭感知肌肉长度和变化速度，当肌肉被快速拉伸时触发牵张反射（肌肉收缩）。高尔基腱器（GTO）才是感知张力、引发抑制的感受器。"},

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",
   q:"「高尔基腱器」（GTO）被激活后产生什么效果？",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch1-2 执业范围/行为改变", color:"#4A7FE8", bg:"#EBF1FC",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch3-5 解剖生理", color:"#9B6DD1", bg:"#F3EEFF",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

   ans:1, exp:"「J型曲线」假说：中等强度规律运动→免疫功能↑；极高强度/过度训练→运动后「免疫开放窗口期」（1-3小时），感染风险暂时升高。这解释了为什么精英运动员高强度训练后更易患呼吸道感染。"},

  {ch:"Ch6-7 运动科学/营养", color:"#2D9E6B", bg:"#EAF7F1",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch11-12 姿势评估/OHSA", color:"#D94F3D", bg:"#FDECEA",

  {ch:"Ch13 灵活性训练", color:"#3DAA7A", bg:"#EAF7F1",

  {ch:"Ch13 灵活性训练", color:"#3DAA7A", bg:"#E8F8F2",

  {ch:"Ch13 灵活性训练", color:"#3DAA7A", bg:"#E8F8F2",

  {ch:"Ch16-18 纠正性训练/心肺", color:"#3A72C8", bg:"#EBF1FC",

// ════════════════════════════════════════════════
// 本地存储
// ════════════════════════════════════════════════
const STORE_KEY = "nasm_quiz_v3";
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {answered:{},wrong:[],bookmarks:[]}; }
  catch { return {answered:{},wrong:[],bookmarks:[]}; }
}
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
let store = loadStore();

// ════════════════════════════════════════════════
// 首页
// ════════════════════════════════════════════════
const CHAPTERS = [...new Set(QUESTIONS.map(q=>q.ch))];
const CH_ICONS = ["📋","🦴","⚡","🧠","🤸","🔍","📊","🏃","💪","👶","🌿","❤️"];

function buildHome() {
  const total   = Object.keys(store.answered).length;
  const correct = Object.values(store.answered).filter(v=>v===true).length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statAcc").textContent = total ? Math.round(correct/total*100)+"%" : "—";
  document.getElementById("statWrong").textContent = store.wrong.length;

  const list = document.getElementById("chapterList");
  list.innerHTML = "";
  CHAPTERS.forEach((ch,ci) => {
    const qs = QUESTIONS.filter(q=>q.ch===ch);
    const done = qs.filter(q=>store.answered[QUESTIONS.indexOf(q)]!==undefined).length;
    const pct  = done / qs.length;
    const hasWrong = qs.some(q=>store.wrong.includes(QUESTIONS.indexOf(q)));
    const q0 = qs[0];
    const card = document.createElement("div");
    card.className = "chapter-card" + (hasWrong ? " has-wrong" : "");
    card.innerHTML = `
      <div class="ch-icon" style="background:${q0.bg}">${CH_ICONS[ci]||"📚"}</div>
      <div class="ch-info">
        <div class="ch-name">${ch}</div>
        <div class="ch-meta">${done}/${qs.length} 题已练习${hasWrong?' · 有错题':''}</div>
        <div class="ch-progress"><div class="ch-progress-fill" style="width:${pct*100}%;background:${q0.color}"></div></div>
      </div>
      <div class="ch-arrow">›</div>`;
    card.onclick = () => startQuiz(ch);
    list.appendChild(card);
  });
  document.getElementById("wrongBtn").style.display = store.wrong.length ? "block" : "none";
}

// ════════════════════════════════════════════════
// 答题逻辑
// ════════════════════════════════════════════════
let queue=[], qi=0, sessionRight=0, sessionWrong=0;

function startQuiz(mode) {
  if (mode==="all") queue = shuffle([...QUESTIONS.keys()]);
  else if (mode==="wrong") { if (!store.wrong.length){alert("暂无错题！");return;} queue=shuffle([...store.wrong]); }
  else queue = shuffle(QUESTIONS.map((q,i)=>({q,i})).filter(x=>x.q.ch===mode).map(x=>x.i));
  qi=0; sessionRight=0; sessionWrong=0;
  showPage("quiz");
  document.getElementById("progressBar").style.display="block";
  document.getElementById("backBtn").style.display="inline";
  document.getElementById("topTitle").textContent = mode==="all"?"随机练习":mode==="wrong"?"错题练习":mode;
  renderQuestion();
}

function renderQuestion() {
  if (qi>=queue.length){showResult();return;}
  const idx=queue[qi], q=QUESTIONS[idx], total=queue.length;
  document.getElementById("qCounter").textContent=`${qi+1} / ${total}`;
  document.getElementById("qChapterTag").textContent=q.ch;
  document.getElementById("qText").textContent=q.q;
  document.getElementById("explanation").classList.remove("show");
  document.getElementById("expText").textContent=q.exp;
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("progressFill").style.width=(qi/total*100)+"%";
  document.getElementById("topBadge").textContent=`${qi+1}/${total}`;
  const bm=document.getElementById("bookmark");
  bm.textContent=store.bookmarks.includes(idx)?"★":"☆";
  const opts=document.getElementById("options");
  opts.innerHTML="";
  const letters=["A","B","C","D"];
  q.opts.forEach((text,i)=>{
    const div=document.createElement("div");
    div.className="option";
    div.innerHTML=`<div class="opt-dot">${letters[i]}</div><div>${text}</div>`;
    div.onclick=()=>selectAnswer(i,q.ans,idx);
    opts.appendChild(div);
  });
  document.getElementById("quiz").classList.remove("fade-up");
  void document.getElementById("quiz").offsetWidth;
  document.getElementById("quiz").classList.add("fade-up");
}

function selectAnswer(selected,correct,idx) {
  const opts=document.querySelectorAll(".option");
  opts.forEach((el,i)=>{
    el.onclick=null;
    if(i===correct) el.classList.add("correct");
    else if(i===selected&&selected!==correct) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const isRight=selected===correct;
  if(isRight){sessionRight++;store.answered[idx]=true;store.wrong=store.wrong.filter(x=>x!==idx);}
  else{sessionWrong++;store.answered[idx]=false;if(!store.wrong.includes(idx))store.wrong.push(idx);}
  saveStore(store);
  document.getElementById("explanation").classList.add("show");
  const nb=document.getElementById("nextBtn");
  nb.style.display="block";
  nb.textContent=qi+1>=queue.length?"查看结果":"继续下一题";
}

function nextQuestion(){qi++;renderQuestion();}

function toggleBookmark(){
  const idx=queue[qi];
  const i=store.bookmarks.indexOf(idx);
  if(i>=0)store.bookmarks.splice(i,1); else store.bookmarks.push(idx);
  saveStore(store);
  document.getElementById("bookmark").textContent=store.bookmarks.includes(idx)?"★":"☆";
}

function showResult(){
  const total=queue.length, pct=Math.round(sessionRight/total*100);
  document.getElementById("resultEmoji").textContent=pct>=80?"🎉":pct>=60?"💪":"📖";
  document.getElementById("resultTitle").textContent=pct>=80?"太棒了！":pct>=60?"继续加油！":"多练练吧～";
  document.getElementById("resultSub").textContent=`正确率 ${pct}%，共完成 ${total} 题`;
  document.getElementById("rs1").textContent=sessionRight;
  document.getElementById("rs2").textContent=sessionWrong;
  document.getElementById("rs3").textContent=pct+"%";
  document.getElementById("rs4").textContent=store.bookmarks.length;
  document.getElementById("retryWrongBtn").style.display=sessionWrong>0?"block":"none";
  showPage("result");
  document.getElementById("progressFill").style.width="100%";
}

function showPage(name){
  ["home","quiz","result"].forEach(p=>{document.getElementById(p).style.display=p===name?"block":"none";});
}
function goHome(){
  showPage("home");
  document.getElementById("progressBar").style.display="none";
  document.getElementById("backBtn").style.display="none";
  document.getElementById("topTitle").textContent="NASM-CPT 刷题";
  document.getElementById("topBadge").textContent="";
  buildHome();
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

buildHome();
</script>
